name: Jiggle core

# Tests and benchmarks for rust_lib/jiggle_core, and the proof that the C#
# package agrees with it.
#
# rust-rust-ci.yml already builds and tests the whole workspace, but
# `cargo test --workspace` stops at the first failing doc-test. This workflow
# gives the crate a result of its own.
#
# The ffi job is the one that matters most for Unity. It builds the release
# library the way Unity gets it, compiles Runtime/Core and the editor tests of
# the package as a plain .NET program and runs them against that library. The
# managed kernel and the Rust kernel then work on the same memory and must give
# the same bits, struct layouts are checked field by field, and a golden scene
# ties the C# world to the Rust world.
#
# The unity-stubs job is the only check of the Unity layer that can run
# without Unity. It compiles Runtime/Unity, Editor and the editor tests against
# a hand written subset of the Unity 2022.3 API, one project per asmdef, so a
# wrong member, a missing using or a Core internal used from another assembly
# fails here. It cannot say how the real engine behaves. Burst, the transform
# jobs and the lab run only inside Unity.
#
# Starting after an apply: Apply Replacements commits its result as
# "[skip ci]", so the push trigger below never fires for a drop that arrived as
# an archive in .mdix/replacements. The workflow_run trigger covers that. It
# starts when a manual run of Apply Replacements has completed with success and
# tests the branch as it stands, which has the commit that apply made. A run
# that only previews (the push of an archive, or dry_run true) can start it
# as well, and then tests the same commit again.
#
# The benchmark job is manual: Actions -> Jiggle core -> Run workflow, then
# tick "bench". It runs the step bench and the scene bench, and the results
# land in that run's Job Summary. GitHub-hosted runners are shared hardware, so
# read them as "did anything change a lot between two runs", not as absolute
# speed. The comparison with Burst is made by the Jiggle Lab inside Unity on
# one machine, not by comparing this summary with a Unity run.
on:
  push:
    paths:
      - 'rust_lib/jiggle_core/**'
      - 'packages/com.midmanstudio.allthingsjiggle/**'
      - '.github/workflows/jiggle-core.yml'
  workflow_run:
    workflows: ['Apply replacements']
    types: [completed]
  workflow_dispatch:
    inputs:
      bench:
        description: 'Also run the benchmarks and write them to the job summary'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      # --all-targets also compiles the bench harness, so it cannot stop
      # compiling between bench runs.
      - name: Build all targets
        run: cargo build -p jiggle_core --all-targets

      - name: Run tests
        run: cargo test -p jiggle_core

      # Lints are shown in the log and do not fail the job, so a lint added in
      # a newer clippy cannot break a push by itself.
      - name: Lint
        run: cargo clippy -p jiggle_core --all-targets

      - name: Build docs (broken links are errors)
        env:
          RUSTDOCFLAGS: -D rustdoc::broken-intra-doc-links
        run: cargo doc -p jiggle_core --no-deps

  # The C interface and the C# package, end to end. The export count from nm
  # must equal the number of DllImports, so a function added in Rust and
  # forgotten in C# fails here.
  ffi:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the native library
        run: cargo build --release -p jiggle_core

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run the C# package against the library
        run: |
          LIB=target/release/libjiggle_core.so
          EXPORTS=$(nm -D --defined-only "$LIB" | grep -c ' T jgl_')
          echo "jgl_ exports: $EXPORTS"
          dotnet run -c Release \
            --project packages/com.midmanstudio.allthingsjiggle/Tests~/DotnetHarness \
            -- "$LIB" --expect-exports "$EXPORTS"

  # jiggle_core declares rust-version 1.75. Testing only on stable never
  # notices a floor break, so this job runs the tests on 1.75.0. The crate is
  # copied into a workspace of its own first, so cargo does not resolve the
  # dependencies of the other workspace crates (some of them need a newer
  # cargo than 1.75 just to read their manifests).
  floor:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0

      - name: Copy the crate into a workspace of its own
        run: |
          mkdir /tmp/floor
          cp -r rust_lib/jiggle_core /tmp/floor/jiggle_core
          printf '[workspace]\nmembers = ["jiggle_core"]\nresolver = "2"\n' > /tmp/floor/Cargo.toml

      - name: Run tests on the floor
        working-directory: /tmp/floor
        run: cargo test

  # The Unity layer compiled against the Unity API stubs, one project per
  # asmdef: the Core with no references at all (noEngineReferences), then
  # Runtime/Unity, Editor and the tests with only the references their asmdefs
  # list. Also two repository rules a Unity build would only break on later.
  unity-stubs:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile Core, Runtime/Unity, Editor and the tests against the stubs
        run: |
          cd packages/com.midmanstudio.allthingsjiggle/Tests~/UnityStubs
          dotnet build Tests.csproj -c Release -o /tmp/stub-out
          dotnet build Editor.csproj -c Release -o /tmp/stub-out

      # Burst rejects System.MathF. The Core kernel uses the helpers of
      # JiggleMath, which give the same bits. Only JiggleParams.Bake, which
      # runs once on the main thread and never inside a job, may use MathF.
      - name: No MathF in the code Burst compiles
        run: |
          if grep -rnE 'MathF\.[A-Z]' packages/com.midmanstudio.allthingsjiggle/Runtime/Core --include=*.cs \
              | grep -v 'JiggleParams.cs' | grep -vE ':[0-9]+:[[:space:]]*//'; then
            echo "::error::MathF in Runtime/Core. Use JiggleMath.Sqrt, Abs or Floor (Burst does not support MathF)."
            exit 1
          fi

      # A package that is not embedded in a project is read only, and Unity
      # ignores an asset that has no .meta file next to it. Folders ending in
      # a tilde (Tests~, Documentation~) are not imported and need none.
      - name: Every asset has a .meta file
        run: |
          cd packages/com.midmanstudio.allthingsjiggle
          missing=0
          while IFS= read -r f; do
            if [ ! -f "$f.meta" ]; then
              echo "::error file=packages/com.midmanstudio.allthingsjiggle/${f#./}::no .meta file"
              missing=1
            fi
          done < <(find . -mindepth 1 -name '*~' -prune -o ! -name '*.meta' -print | sort)
          exit $missing

  bench:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bench }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      # --bench NAME runs only that harness. Without it cargo also runs the
      # library's unit tests in bench mode and prints them ahead of the table.
      # Only stdout goes to the files, so compile output stays in the log.
      - name: Run the step bench
        shell: bash
        run: cargo bench -p jiggle_core --bench step_bench > bench-output.txt

      - name: Run the scene bench
        shell: bash
        run: cargo bench -p jiggle_core --bench scene_bench > scene-bench-output.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## jiggle_core bench - $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "Commit: \`${{ github.sha }}\`"
            for f in bench-output.txt scene-bench-output.txt; do
              echo
              echo "### $f"
              echo
              echo '```'
              if [ -f "$f" ]; then
                cat "$f"
              else
                echo "No output: the step that writes $f did not produce a file."
              fi
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
