name: Rust bench

# Manual only. Benchmarks are slow, and GitHub-hosted runners are shared,
# variable-clock hardware — fine for spotting a step-change regression
# between two runs, not trustworthy for absolute numbers. Treat this report
# as "did anything change a lot", not as ground truth for real perf claims.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      # cargo bench already builds in a release-like profile by default.
      # html_reports is already enabled on the criterion dev-dependency in
      # chemistry_core's Cargo.toml, so this produces target/criterion/
      # with a full report + per-benchmark plots, no extra flags needed.
      - name: Run benchmarks
        run: cargo bench -p chemistry_core

      - name: Upload criterion report as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/criterion

  deploy:
    needs: bench
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
