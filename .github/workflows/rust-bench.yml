name: Rust bench

# Manual only. Benchmarks are slow, and GitHub-hosted runners are shared,
# variable-clock hardware — fine for spotting a step-change regression
# between two runs, not trustworthy for absolute numbers. Treat this as
# "did anything change a lot", not ground truth for real perf claims.
#
# Results land in this run's Job Summary (Actions tab -> this run ->
# Summary), not GitHub Pages — Pages was unreliable to view, so this
# workflow doesn't depend on it at all anymore.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      # cargo bench already builds in a release-like profile by default.
      # html_reports stays enabled on the criterion dev-dependency (still
      # useful if you ever want to download target/criterion as an
      # artifact and view it locally), but nothing here depends on Pages.
      - name: Run benchmarks
        run: cargo bench -p chemistry_core 2>&1 | tee bench-output.txt

      # if: always() — still write whatever we have even if the bench step
      # above failed partway through (e.g. one size timed out).
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## chemistry_core bench — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "Commit: \`${{ github.sha }}\`"
            echo
            python3 scripts/summarize_bench.py
            echo
            echo "<details><summary>Raw cargo bench output</summary>"
            echo
            echo '```text'
            cat bench-output.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
