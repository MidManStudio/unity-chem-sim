name: Rust CI

on:
  push:
    paths:
      - 'rust_lib/**'
      - 'Cargo.toml'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'rust_lib/**'
      - 'Cargo.toml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # --all-targets compiles benches too (sim_bench.rs), so a broken bench
      # fails CI immediately instead of silently bit-rotting until someone
      # runs rust-bench.yml by hand.
      - name: Build workspace (all targets)
        run: cargo build --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace
