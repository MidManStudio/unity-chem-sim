[package]
name          = "chemistry_core"
version       = "0.1.0"
edition       = "2021"
authors       = ["MidManStudio"]
description   = "Rust simulation core — LJ forces, spatial hash, velocity Verlet"
license       = "MIT"
repository    = "https://github.com/MidManStudio/unity-chem-sim"

[lib]
name       = "chemistry_core"
crate-type = ["cdylib", "staticlib", "rlib"]

# scalar-math is default, not opt-in: benched (bench #9, isolated
# lj_kernel group) at 3.5-37.6% faster than the SIMD kernel across n=64/
# 256/1024, worst at higher N, not just noise. compute_forces_simd is
# still in the tree and still tested — worth revisiting if the spatial
# hash ever produces tighter, less wasteful candidate lists.
[features]
default     = ["scalar-math"]
scalar-math = []

# mid-math's wide SIMD lane types (f32x4, Vec3x4, Vec3x8, QuatX4, Mask4)
# and mid-collections' GenerationalIndex/SparseSet (atom identity + slot
# lookup) — both vendored copies under rust_lib/vendor/, refreshed via
# .github/workflows/vendor-mid-math.yml and vendor-mid-collections.yml.
# Dev-dependencies and bench targets are stripped from both vendored
# manifests, so this pulls in zero third-party crates, direct or
# transitive.
#
# Real Rust floor is 1.83, not 1.80 as a previous version of this comment
# claimed — mid-math's sse2 module uses `f32::from_bits` in a const
# context, which only became a stable const fn in Rust 1.83. That module
# compiles unconditionally on any x86/x86_64 target regardless of the
# `force-scalar` feature (verified directly: `cargo build -p mid-math
# --features force-scalar` still hits the same errors on 1.75 — the
# feature only changes which impl gets re-exported as the canonical
# Vec3/Vec4/etc, not whether sse2's own source gets compiled and
# type-checked). CI has never caught this gap because
# dtolnay/rust-toolchain@stable always installs whatever's newest, never
# the documented floor specifically — worth a floor-pinned CI job if you
# want a real regression check here instead of just this comment.
[dependencies]
mid-math        = { path = "../vendor/mid-math" }
mid-collections = { path = "../vendor/mid-collections" }

# Non-WASM: RwLock-based config store (same pattern as projectile_core).
# NOTE: this crate already requires Rust 1.83+ (see the dependencies
# comment above), so std::sync::OnceLock/LazyLock cover this same pattern
# without a dependency at all — worth a follow-up pass if you want the
# last external crate gone too. Left as-is for now, not touching it unless
# you ask.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lazy_static = "1.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "sim_bench"
harness = false

# Separate target from sim_bench.rs on purpose -- direct MidVec-vs-Vec
# container comparison, isolated from physics entirely. See its own
# module doc for why it needs to be a real dependency (mid-collections,
# mid-math) available to the bench binary the same way sim_bench.rs
# already gets chemistry_core itself -- Cargo makes a package's own
# [dependencies] visible to its own [[bench]] targets automatically, no
# separate dev-dependency needed for either.
[[bench]]
name    = "bond_storage_compare"
harness = false
