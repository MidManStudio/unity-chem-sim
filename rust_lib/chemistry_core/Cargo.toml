[package]
name          = "chemistry_core"
version       = "0.1.0"
edition       = "2021"
authors       = ["MidManStudio"]
description   = "Rust simulation core — LJ forces, spatial hash, velocity Verlet"
license       = "MIT"
repository    = "https://github.com/MidManStudio/unity-chem-sim"

[lib]
name       = "chemistry_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default     = []
scalar-math = []

# mid-math's wide SIMD lane types (f32x4, Vec3x4, Vec3x8, QuatX4, Mask4) —
# vendored copy at rust_lib/vendor/mid-math, refreshed via
# .github/workflows/vendor-mid-math.yml. Dev-dependencies and bench targets
# are stripped from the vendored manifest, so this pulls in zero third-party
# crates, direct or transitive.
[dependencies]
mid-math = { path = "../vendor/mid-math" }

# Non-WASM: RwLock-based config store (same pattern as projectile_core).
# NOTE: this crate already requires Rust 1.80+ (DixScript-Rust's own floor),
# so std::sync::OnceLock/LazyLock cover this same pattern without a
# dependency at all — worth a follow-up pass if you want the last external
# crate gone too. Left as-is for now, not touching it unless you ask.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lazy_static = "1.5"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "sim_bench"
harness = false

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
