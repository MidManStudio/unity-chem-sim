[package]
name         = "nuclear_core"
version      = "0.0.1"
edition      = "2021"
rust-version = "1.75"
authors      = ["MidManStudio"]
description  = "Nuclide chart, binding energies, decay, fission, neutron capture and fusion for games, with a C interface"
license      = "MIT"
repository   = "https://github.com/MidManStudio/unity-chem-sim"

[lib]
name       = "nuclear_core"
# cdylib for Unity on desktop and Android, staticlib for iOS and WebGL, rlib
# for Rust callers, tests and benches. The C interface is in src/ffi.
crate-type = ["cdylib", "staticlib", "rlib"]

[[bench]]
name    = "chart_bench"
harness = false

# No dependencies on purpose. The mass table is generated source, and the
# random number generator that later milestones need will live in this crate.
[dependencies]

# The root manifest has no [workspace.lints] table, so the lint posture is
# declared here instead of inherited.
[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"
